# Memory for Gradle, and a fixed file encoding.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
# Reuse build outputs and run independent tasks in parallel.
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache: the default direction for Gradle 9 and later. Problems are warnings, not
# failures, so a plugin that does not support it yet cannot break the build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=26.3
loader_version=0.19.5
# Mod Properties
mod_version=0.3.2
maven_group=me.steinborn
archives_base_name=krypton
