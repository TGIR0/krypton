plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

repositories {
    maven {
        url "https://repo.papermc.io/repository/maven-public/"
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    // The JUnit BOM keeps every JUnit artifact on the same version.
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation include("com.velocitypowered:velocity-native:3.4.0-SNAPSHOT")
}

test {
    useJUnitPlatform()

    // Show why a test failed directly in the build log (useful in GitHub Actions).
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }

    // Make Netty report any leaked reference-counted buffer while tests run.
    systemProperty 'io.netty.leakDetection.level', 'paranoid'
}

processResources {
    // Read the version now, while Gradle configures the build. The closure below runs later, and
    // touching `project` inside it is not allowed with the configuration cache.
    def modVersion = project.version.toString()
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    // UTF-8 regardless of the system default, and compile against the Java 25 API.
    options.encoding = 'UTF-8'
    options.release = 25
}

// Identical inputs produce an identical jar (same file order, no timestamps).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from "LICENSE"
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}


loom {
    accessWidenerPath = file("src/main/resources/krypton.accesswidener")
}
